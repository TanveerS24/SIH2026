services:
  postgres:
    image: postgres:16-alpine
    container_name: pramaan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pramaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pramaan_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pramaan_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pramaan} -d ${POSTGRES_DB:-pramaan_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pramaan_network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: pramaan_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pramaan_network

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: pramaan_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/evidence;
      /usr/bin/mc mb --ignore-existing local/documents;
      /usr/bin/mc mb --ignore-existing local/exports;
      exit 0;
      "
    networks:
      - pramaan_network

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: pramaan_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-pramaan}:${POSTGRES_PASSWORD:-pramaan_dev_secret}@postgres:5432/${POSTGRES_DB:-pramaan_db}?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: evidence
      MINIO_REGION: us-east-1
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-pramaan_dev_jwt_access_secret_super_secure_key_12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-pramaan_dev_jwt_refresh_secret_super_secure_key_67890}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      TOTP_ISSUER: Pramaan_NCRB
      WEB_URL: http://localhost:8081
      CORS_ORIGIN: "http://localhost:8081,http://localhost:19006,http://localhost:3000,http://localhost:4000"
      SIMULATE_MALWARE_SCAN: "true"
      SIMULATE_OCR_AI: "true"
      SIMULATE_LEDGER: "true"
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      RAG_STRICT_MODE: "true"
      RAG_CHUNK_SIZE: "500"
      RAG_CHUNK_OVERLAP: "100"
      RAG_TOP_K: "5"
      RAG_SIMILARITY_THRESHOLD: "0.3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    volumes:
      - ./server/src:/app/server/src
      - ./shared/src:/app/shared/src
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pramaan_network

  # Note: Ollama runs natively on the host machine via 'ollama serve'
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: pramaan_ollama
  #   restart: unless-stopped
  #   ports:
  #     - "${OLLAMA_PORT:-11434}:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - pramaan_network

  # Note: Frontend (Expo) is run locally via 'npm start' or 'npx expo start' in client/
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: client/Dockerfile
  #   container_name: pramaan_frontend
  #   restart: unless-stopped
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   environment:
  #     EXPO_PUBLIC_API_URL: http://localhost:4000
  #   ports:
  #     - "8081:8081"
  #   networks:
  #     - pramaan_network

volumes:
  postgres_data:
  minio_data:

networks:
  pramaan_network:
    driver: bridge
