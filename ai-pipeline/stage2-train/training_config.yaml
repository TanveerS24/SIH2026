# Pramaan AI - Stage 2 Qwen 2.5 7B Fine-Tuning Configuration
model:
  base_model: "Qwen/Qwen2.5-7B-Instruct"
  torch_dtype: "bfloat16"
  use_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "./output/qwen2.5-7b-pramaan-lora"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  logging_steps: 10
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  fp16: false
  bf16: true
  max_seq_length: 2048
  dataset_path: "./data/pramaan_evidence_train.jsonl"
  eval_dataset_path: "./data/pramaan_evidence_eval.jsonl"
