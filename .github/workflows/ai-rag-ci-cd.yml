name: Pramaan AI RAG CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'server/src/services/rag.service.ts'
      - 'server/src/services/chunking.service.ts'
      - 'server/src/ai-pipeline/**'
      - 'server/prisma/schema.prisma'
      - 'server/tests/rag.test.ts'
      - '.github/workflows/ai-rag-ci-cd.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      trigger_stage2_training:
        description: 'Trigger Stage 2 Fine-Tuning and Evaluation Pipeline'
        required: false
        default: false
        type: boolean

jobs:
  rag-evaluation-and-benchmark:
    name: Strict RAG Validation & Golden Benchmark
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pramaan
          POSTGRES_PASSWORD: pramaan_dev_secret
          POSTGRES_DB: pramaan_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client & Migrate Schema
        run: |
          cd server
          npx prisma generate
        env:
          DATABASE_URL: postgresql://pramaan:pramaan_dev_secret@localhost:5432/pramaan_db?schema=public

      - name: Stage 1 & 2: Run Strict RAG Unit & Vector Math Tests
        run: |
          cd server
          npm run test:rag
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://pramaan:pramaan_dev_secret@localhost:5432/pramaan_db?schema=public

      - name: Stage 3 & 4: Run Multi-Stage AI CI/CD Benchmark Runner
        run: |
          cd server
          npm run ai:ci-cd
        env:
          DATABASE_URL: postgresql://pramaan:pramaan_dev_secret@localhost:5432/pramaan_db?schema=public
          OLLAMA_BASE_URL: http://localhost:11434
          LLM_MODEL: qwen2.5:7b
          EMBEDDING_MODEL: nomic-embed-text
          RAG_STRICT_MODE: true

  stage2-model-training-and-testing:
    name: Stage 2 Model Fine-Tuning & Evaluation Check
    needs: rag-evaluation-and-benchmark
    if: github.event.inputs.trigger_stage2_training == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyTorch & PEFT Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers peft datasets accelerate bitsandbytes pyyaml

      - name: Verify Stage-2 Fine-Tuning Dataset Generator
        run: |
          python ai-pipeline/stage2-train/dataset_generator.py --validate

      - name: Dry-Run Stage-2 Evaluation Harness
        run: |
          python ai-pipeline/stage2-train/eval_qwen2_5.py --dry-run
