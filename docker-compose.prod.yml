# Pramaan - Production-Style Docker Compose Architecture
# Note: Designed for production-like deployment demonstration with hardened container security,
# persistent volume bindings, and production-mode artifacts.
# DISCLAIMER: Prototype architecture — requires official government security compliance certification for actual field deployment.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pramaan_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pramaan_prod_network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: pramaan_prod_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data
    volumes:
      - prod_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pramaan_prod_network

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runner
    container_name: pramaan_prod_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: evidence
      MINIO_REGION: us-east-1
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      TOTP_ISSUER: Pramaan_NCRB
      WEB_URL: ${WEB_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health', (r) => {if (r.statusCode !== 200) process.exit(1);})\""]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pramaan_prod_network

volumes:
  prod_postgres_data:
  prod_minio_data:

networks:
  pramaan_prod_network:
    driver: bridge
